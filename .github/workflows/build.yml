name: Build Ys Music Play V4

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract V4 source ZIP
        id: extract
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f \
            -name "YsMusicPlay_V4_DEV.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V4 ZIP not found"
            exit 1
          fi

          DEST="$RUNNER_TEMP/ysmusic-v4"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"

          SETTINGS=$(find "$DEST" -type f \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: YsMusicPlay-V4-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
