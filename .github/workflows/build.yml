
name: Build Ys Music Play V5.1 MP3 AI

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract V5.1 source ZIP
        id: extract
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 4 -type f -name "YsMusicPlay_V5_1_MP3_AI.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: YsMusicPlay_V5_1_MP3_AI.zip not found"
            find . -maxdepth 4 -type f
            exit 1
          fi
          DEST="$RUNNER_TEMP/ysmusic-v5-1"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"
          SETTINGS=$(find "$DEST" -type f -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          test -f "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fetch Demucs Android engine
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          mkdir -p third_party
          git clone --depth 1 --recurse-submodules https://github.com/jPaauwe/demucs-android third_party/demucs-android
          test -f third_party/demucs-android/third_party/eigen/Eigen/Dense

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YsMusicPlay-V5.1-MP3-AI-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
